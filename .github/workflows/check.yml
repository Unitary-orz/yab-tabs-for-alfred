name: Check workflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: sh -n workflow/run.sh
      - name: Build workflow
        run: python scripts/build.py
      - name: Check committed package is current
        run: git diff --exit-code -- 'Yab Tabs for Alfred.alfredworkflow'
